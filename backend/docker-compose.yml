version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: jobhunter-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - jobhunter-pg-data:/var/lib/postgresql/data

volumes:
  jobhunter-pg-data:
