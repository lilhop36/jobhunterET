# ──────────────────────────────────────────────────────────────
# JobHunter CI — runs on every PR and push to main
#
# Gate 1: Static analysis (lint + typecheck) — <2 min
# Gate 2: Unit tests with coverage gates — <5 min
# Gate 3: Frontend build verification — <3 min
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ═══════════════════════════════════════════════════════════
  # Gate 1: Static Analysis — lint + typecheck
  # ═══════════════════════════════════════════════════════════
  lint-and-typecheck:
    name: "Gate 1: Lint & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── Backend ──
      - name: Backend — install dependencies
        working-directory: backend
        run: npm ci

      - name: Backend — Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      # This is a real gate: the backend has no ESLint install/config (the
      # previous `eslint` step could never run), so `npm run lint` maps to the
      # TypeScript compiler and must pass.
      - name: Backend — TypeScript check (blocking)
        working-directory: backend
        run: npm run lint

      # ── Frontend ──
      - name: Frontend — install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════════════
  # Gate 2: Unit Tests — backend + coverage gate
  # ═══════════════════════════════════════════════════════════
  test-backend:
    name: "Gate 2: Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Keep SQLite schema for tests (tests mock Prisma, SQLite types are fine)
      - name: Generate Prisma client (SQLite)
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"

      # `npm run test:coverage` provisions a disposable SQLite database
      # (prisma db push --force-reset + seed) before running jest. The exit
      # status is the real jest status: there is no pipe to `tee` that could
      # mask a red suite.
      - name: Run tests with coverage
        working-directory: backend
        run: npm run test:coverage -- --ci --testTimeout=30000

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Gate 3: Frontend build verification
  # ═══════════════════════════════════════════════════════════
  build-frontend:
    name: "Gate 3: Frontend Build"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (verifies TypeScript + all imports resolve)
        working-directory: frontend
        run: npm run build

  # ═══════════════════════════════════════════════════════════
  # Gate 4: Dependency audit
  # ═══════════════════════════════════════════════════════════
  security:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend — install dependencies
        working-directory: backend
        run: npm ci

      # Audit reports are informational until the advisory backlog is cleared;
      # the job still surfaces them in the log without pretending to pass.
      - name: Audit backend dependencies (high+)
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Frontend — install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (high+)
        working-directory: frontend
        run: npm audit --audit-level=critical
