<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunter — Dev Server Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 2rem; max-width: 520px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #38bdf8; }
    .subtitle { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .status { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .label { font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    th { color: #94a3b8; font-weight: 500; }
    td:last-child { color: #38bdf8; font-family: monospace; }
    .link { display: inline-block; margin-top: 1.5rem; color: #38bdf8; text-decoration: none; font-weight: 500; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 JobHunter</h1>
    <p class="subtitle">Intelligent Job Search &amp; Notification System — SRS v2.3</p>
    <div class="status">
      <span class="dot"></span>
      <span class="label">Dev servers running</span>
    </div>
    <table>
      <tr><th>Service</th><th>URL</th></tr>
      <tr><td>Frontend (Next.js)</td><td>localhost:3211</td></tr>
      <tr><td>Backend API (NestJS)</td><td>localhost:3210</td></tr>
      <tr><td>PostgreSQL</td><td>localhost:5432</td></tr>
    </table>
    <a class="link" href="http://localhost:3211" target="_blank">Open App →</a>
  </div>
</body>
</html>
